project:
  name: "sam3_cdca_finetune"
  output_dir: "./checkpoints"

data:
  name: "iSAID"
  root: ""
  class_name_path: "text_prompt/isaid.txt"
  bg_idx: 0
  reduce_zero_label: false
  ignore_index: 255
  batch_size: 8
  num_workers: 4
  num_classes: 16
  pin_memory: true
  drop_last: false
  shuffle: true
  mode: "train"
  split: "train"

model:
  bpe_path: "assets/bpe_simple_vocab_16e6.txt.gz"
  sam3_checkpoint: ""
  adapter_resume_path: null
  d_model: 256
  nhead: 8

train:
  total_steps: 80000
  lr: 0.0001
  weight_decay: 0.0005
  accumulation_steps: 1
  
  save_steps: 200
  log_interval: 10
  
  loss_weights:
    ce: 1.0
    dice: 1.0
    presence: 1.0